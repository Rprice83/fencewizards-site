# Cloudflare Pages project: static site in /public, API in /functions, D1 database for quotes.
name = "fencewizards"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "fencewizards-quotes"
database_id = "a4fffd0b-7249-46c6-bb25-c1b223797b66" # demo DB in the developer's Cloudflare account; replace if moved to a Fence Wizards account
migrations_dir = "migrations"

[vars]
QUOTE_TO = "richard@fencewizards.com"
QUOTE_FROM = "Fence Wizards Quotes <quotes@fencewizards.com>" # must be on a domain verified in Resend
SITE_URL = "https://www.fencewizards.com"

# Quote Inbox (/staff/): see "Quote Inbox setup" in README.md
ACCESS_TEAM_DOMAIN = "limestone-web-co.cloudflareaccess.com"   # the developer's Zero Trust team (demo)
ACCESS_AUD = "42e205aa47b1cb469410fcaafd737a5351bf4c943569a71935bc8b81af0f5ca3"   # "Quote Inbox" Access app (demo)
STAFF_EMAILS = "richwarren1995@gmail.com,omniring09@gmail.com"  # must match the Access policy
OWNER_EMAILS = "richwarren1995@gmail.com,omniring09@gmail.com"  # owner-only things later (Stripe)
STAFF_NAMES = "richwarren1995@gmail.com=Richard"  # optional: "email=Name,..." so notes are signed with first names

# Secrets (never commit): set with `wrangler pages secret put RESEND_API_KEY`
# For local dev, put them in site/.dev.vars (see .dev.vars.example).
